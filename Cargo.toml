[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Exact `=` pins only; each task adds the crates it uses (versions: design spec table).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
tempfile = "=3.27.0"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
thiserror = "=2.0.21"
sha2 = "=0.11.1"
# Without default features: no crossbeam; FSEvents stays on for macOS.
notify = { version = "=8.2.2", default-features = false, features = ["macos_fsevent"] }
# Process info only (no disks, networks, components, users, GPUs).
sysinfo = { version = "=0.40.3", default-features = false, features = ["system"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
hub-core = { path = "crates/hub-core" }

[workspace.lints.clippy]
all = "deny"
